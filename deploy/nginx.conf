# 寅铠官网 Nginx 站点配置(整站 VPS 部署)
# 用法:把 __DOMAIN__ 替换为真实域名后放到 /etc/nginx/sites-available/yinkai.conf,再 ln -s 到 sites-enabled
#   sudo sed 's/__DOMAIN__/example.com/g' deploy/nginx.conf | sudo tee /etc/nginx/sites-available/yinkai.conf
# 本文件只写 80 端口;HTTPS 由 certbot --nginx 自动改写(加 443 监听、证书路径与 80→443 跳转),不要手写证书段
#
# 路径分流:
#   /            dist/ 静态文件(Vue SPA),找不到的路径回退 index.html 交给 vue-router
#   /api/*       反代到 pm2 守护的 Express(127.0.0.1:3001)
#   /uploads/*   反代到 Express(管理端上传的图片由它静态托管)

server {
    listen 80;
    listen [::]:80;
    server_name www.__DOMAIN__ __DOMAIN__;

    root /var/www/yinkai/dist;
    index index.html;

    # Nginx 默认请求体上限 1m:管理端图片 5MB、简历 10MB 都会在这一层 413,必须放宽
    client_max_body_size 12m;

    # 构建产物按 ERR-001 规避关闭了 minify(约 641KB),gzip 后约 150KB,是本站性能关键
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # dist/assets/ 文件名带内容 hash,可长期缓存;发版后 index.html 引用新 hash 自动换新
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 入口页永不缓存,保证发版后浏览器立刻拿到新 index.html(try_files 的内部跳转也会落到这里)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # proxy_pass 结尾不能带 / 或路径:带了会剥掉 /api 前缀,后端路由(挂在 /api)全部 404
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA 深链回退(等价于 netlify.toml 的通配 redirect 200)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
